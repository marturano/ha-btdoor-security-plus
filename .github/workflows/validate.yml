name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Validate with HACS
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Validate with hassfest
        uses: home-assistant/actions/hassfest@master

  python:
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install validation dependencies
        run: python -m pip install --upgrade pip pytest ruff mypy
      - name: Compile integration
        run: python -m compileall -q custom_components/btdoor_security_plus
      - name: Validate JSON files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path("custom_components/btdoor_security_plus").rglob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
              print(path)
          json.loads(Path("hacs.json").read_text(encoding="utf-8"))
          PY
      - name: Publication preflight
        run: python tools/publication/check_repository_publication.py
      - name: Ruff
        run: ruff check custom_components/btdoor_security_plus tests tools
      - name: Mypy
        run: mypy custom_components/btdoor_security_plus
      - name: Full test suite
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: pytest -q -p no:cacheprovider -p pytest_asyncio.plugin

  ha-compatibility:
    name: HA ${{ matrix.homeassistant }} import compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        homeassistant: ["2026.1.0", "2026.3.4", "2026.5.4", "2026.6.4", "2026.7.2"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Home Assistant and integration requirement
        run: |
          python -m pip install --upgrade pip
          python -m pip install "homeassistant==${{ matrix.homeassistant }}" "asn1crypto==1.5.1"
      - name: Run import/API compatibility smoke test
        run: python tools/check_ha_compatibility.py
