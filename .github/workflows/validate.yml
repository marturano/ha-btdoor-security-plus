name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Validate with HACS
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Validate with hassfest
        uses: home-assistant/actions/hassfest@master

  python:
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install validation dependencies
        run: python -m pip install --upgrade pip pytest ruff mypy
      - name: Compile integration
        run: python -m compileall -q custom_components/btdoor_security_plus
      - name: Validate JSON files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path("custom_components/btdoor_security_plus").rglob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
              print(path)
          json.loads(Path("hacs.json").read_text(encoding="utf-8"))
          PY
      - name: Ruff critical errors
        run: >
          ruff check
          --select E9,F63,F7,F82
          custom_components/btdoor_security_plus
          tests
      - name: Release regression tests
        run: pytest -q tests/test_release_6_0_0.py tests/test_device_localization_rc3e.py tests/test_device_registry_support_rc3f.py tests/test_options_translations_rc3c.py
