name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Validate with HACS
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Validate with hassfest
        uses: home-assistant/actions/hassfest@master

  python:
    name: Python, governance and repository gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPYCACHEPREFIX: /tmp/btdoor-pycache
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14.2"
          cache: pip
      - name: Run canonical read-only validation
        shell: bash
        run: bash tools/validation/github_sandbox_validate.sh check
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: validate-python-governance-evidence
          path: artifacts/github-sandbox-validation
          if-no-files-found: error

  ha-compatibility:
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPYCACHEPREFIX: /tmp/btdoor-pycache
    name: HA ${{ matrix.homeassistant }} import compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - homeassistant: "2026.1.0"
            python: "3.13"
          - homeassistant: "2026.3.4"
            python: "3.14.2"
          - homeassistant: "2026.5.4"
            python: "3.14.2"
          - homeassistant: "2026.6.4"
            python: "3.14.2"
          - homeassistant: "2026.7.2"
            python: "3.14.2"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "${{ matrix.python }}"
          cache: pip
      - name: Install Home Assistant and integration requirement
        run: |
          python -m pip install --upgrade pip
          python -m pip install "homeassistant==${{ matrix.homeassistant }}" "asn1crypto==1.5.1"
      - name: Run import/API compatibility smoke test
        run: python tools/check_ha_compatibility.py
