title: BTDoor Mobile
views:
  - title: BTDoor
    path: btdoor
    icon: mdi:doorbell-video
    cards:
      - type: button
        entity: button.apri_cancello
        name: Apri cancello
        icon: mdi:gate-open
        show_state: false
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.apri_cancello
          confirmation:
            text: Confermi l'apertura del cancello?
        hold_action:
          action: more-info
      - type: tile
        entity: binary_sensor.btdoor_template_ringing
        name: Chiamata
      - type: tile
        entity: sensor.btdoor_template_call_state
        name: Stato chiamata
      - type: tile
        entity: binary_sensor.btdoor_template_sip_registered
        name: SIP
      - type: tile
        entity: binary_sensor.btdoor_template_cloud_connected
        name: Cloud
      - type: gauge
        entity: sensor.btdoor_template_runtime_score
        name: Salute
        min: 0
        max: 100
